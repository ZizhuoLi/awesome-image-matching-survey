# Source of the paper list in README.md. Edit this file, then run: python scripts/build_readme.py
#
# sections: README structure in display order. Papers attach to a section through its `id`.
# papers:   name, title, venue, year, section are required; paper (link), code (official repo) and
#           highlight (representative method in the survey timeline) are optional.
sections:
- id: classical
  level: 2
  emoji: 📜
  title: Classical Image Matching Pipeline
  description: 'The handcrafted pipeline that learning-based methods build on (Section 2 of the survey): detectors and descriptors such as SIFT and ORB, consensus-based mismatch removal, and RANSAC-family robust estimators.'
  collapsed: true
- level: 2
  emoji: 🧩
  title: Alternative Learnable Step
  description: Methods that replace **one step** of the classical pipeline with a learnable counterpart, while matching itself still relies on descriptor similarity (Section 3 of the survey).
- level: 3
  title: Learnable Detector-Descriptor
  figure: assets/detector_descriptor.png
  width: 75%
  caption: Frameworks of isolated and joint learnable detector-descriptors.
  description: Learnable replacements for keypoint detection and description, the first stage to be learned. Isolated methods learn the detector or the descriptor separately; joint methods detect and describe within one model, with cascaded, branched, or decoupled structures.
- id: ldd-detector
  level: 4
  title: Learnable Detector
  context: Isolated detector-descriptor
  description: Learn where to detect keypoints that are reliable and repeatable across views.
- id: ldd-descriptor
  level: 4
  title: Learnable Descriptor
  context: Isolated detector-descriptor
  description: Learn discriminative descriptions of given keypoints that are invariant to viewpoint and appearance changes, from early metric learning to deep patch descriptors and context-aware descriptors.
- id: ldd-cascaded
  level: 4
  title: Cascaded Structure
  context: Joint detector-descriptor
  description: Detection and description are performed sequentially, either detect-then-describe (e.g., LIFT, LF-Net) or describe-then-detect (e.g., D2-Net).
- id: ldd-branched
  level: 4
  title: Branched Structure
  context: Joint detector-descriptor
  description: A shared backbone feeds parallel detection and description heads (e.g., SuperPoint, R2D2, DISK, ALIKED).
- id: ldd-decoupled
  level: 4
  title: Decoupled Structure
  context: Joint detector-descriptor
  description: Detector and descriptor are trained separately but designed to work together (e.g., DeDoDe, XFeat, RDD).
- id: ldd-application
  level: 4
  title: Application-Specific Features
  context: Learnable detector-descriptor
  description: Local features tailored to texture images, retinal images, low-light and underwater scenes, deformable objects, motion blur, and specific robotics tasks.
- id: ldd-refinement
  level: 4
  title: Keypoint and Match Refinement
  context: Learnable detector-descriptor
  description: Refine the keypoints or matches produced by existing detectors instead of designing a new detector.
- level: 3
  title: Learnable Outlier Filter
  figure: assets/outlier_filter.png
  width: 75%
  caption: Frameworks of context exploration and motion coherence-guided outlier filters.
  description: Classify putative correspondences into inliers and outliers, usually from their coordinates alone.
- id: of-context
  level: 4
  title: Context Exploration Method
  context: Learnable outlier filter
  description: Aggregate global and local context from other correspondences with normalization, pooling, graphs, attention, or state-space models.
- id: of-coherence
  level: 4
  title: Motion Coherence-Guided Method
  context: Learnable outlier filter
  description: Explicitly estimate or regularize the smooth motion field formed by inliers, and identify inliers by their consistency with it.
- level: 3
  title: Learnable Geometric Estimator
  figure: assets/estimator.png
  width: 60%
  caption: Frameworks of least squares-based, RANSAC-variant, and unsupervised learnable estimators.
  description: Learnable components that operate inside model estimation, i.e., in solving, minimal-set sampling, or hypothesis scoring.
- id: ge-ls
  level: 4
  title: Least Squares-Based Method
  context: Learnable geometric estimator
  description: Iteratively reweighted least squares with learned correspondence weights.
- id: ge-sampling
  level: 4
  title: Learnable Minimal Set Sampling
  context: Variants of RANSAC
  description: Learn where RANSAC should sample minimal sets.
- id: ge-selection
  level: 4
  title: Learnable Hypothesis Selection
  context: Variants of RANSAC
  description: Learn to score hypotheses or to reject unpromising minimal samples before model estimation.
- id: ge-unsup
  level: 4
  title: Unsupervised Learning Method
  context: Learnable geometric estimator
  description: Learn consensus maximization without ground-truth models, e.g., with reinforcement learning.
- level: 2
  emoji: 🔗
  title: Merged Learnable Module
  description: Methods that **merge several consecutive steps** of the classical pipeline into one network (Section 4 of the survey).
- id: sparse
  level: 3
  title: Middle-End Sparse Matcher
  figure: assets/sparse_matcher.png
  width: 85%
  caption: Framework of middle-end sparse matchers.
  description: Merge the feature matcher and the outlier filter. Attention-based graph neural networks jointly reason over keypoint positions and descriptors and solve an assignment problem.
- level: 3
  title: End-to-End Semi-Dense Matcher
  figure: assets/semidense_matcher.png
  width: 90%
  caption: Frameworks of end-to-end semi-dense matchers.
  description: Detector-free matchers that match coarse patches directly from the image pair and then refine the matches to sub-pixel accuracy.
- id: semi-nc
  level: 4
  title: Neighbourhood Consensus Filtering
  context: Semi-dense matcher
  description: Regularize a 4D correlation volume with (sparse) 4D convolutions to enforce neighbourhood consensus.
- id: semi-comm
  level: 4
  title: Intra-/Inter-Image Communication
  context: Semi-dense matcher
  description: Transformer-based self- and cross-attention in a coarse-to-fine design pioneered by LoFTR, improved for accuracy, efficiency, and multi-view consistency.
- level: 3
  title: End-to-End Dense Matcher
  figure: assets/dense_matcher.png
  width: 90%
  caption: Frameworks of end-to-end dense matchers.
  description: Regress a dense flow field, usually with a confidence map, between two views, unifying local feature matching and optical flow.
- id: dense-g2l
  level: 4
  title: Global-to-Local Architecture
  context: Dense matcher
  description: Global correlation at a coarse level followed by local refinement, including probabilistic matchers, foundation-model-based matchers, and optical-flow-style models.
- id: dense-func
  level: 4
  title: Functional Correspondence Architecture
  context: Dense matcher
  description: Take a query coordinate in one image and directly regress the corresponding coordinate in the other.
- level: 3
  title: Pose Regressor
  figure: assets/pose_regressor.png
  width: 60%
  caption: Frameworks of deep homography estimation and relative pose regression.
  description: Bypass explicit correspondences and regress the two-view transformation directly from the image pair.
- id: pr-dhe
  level: 4
  title: Deep Homography Estimation
  context: Pose regressor
  description: Estimate a homography with 4-point offset regression, IC-LK-style optimization, or other parameterizations, with supervised or unsupervised training.
- id: pr-rt
  level: 4
  title: Rotation-Translation Regression
  context: Relative pose regression
  description: Regress the relative rotation and translation (or the rotation only) from an image pair.
- id: pr-fe
  level: 4
  title: Fundamental/Essential Matrix Regression
  context: Relative pose regression
  description: Regress the fundamental or essential matrix and decompose it into a relative pose.
- id: datasets
  level: 2
  emoji: 📊
  title: Datasets and Benchmarks
  description: Datasets and benchmarks used for training and evaluation in the survey (Section 5), together with the newer benchmarks discussed in its outlook.
- id: tools
  level: 2
  emoji: 🧰
  title: Toolboxes
  description: Reconstruction and localization frameworks used in the survey's evaluation protocols.
- level: 2
  emoji: 🔭
  title: Future Directions
  description: Open problems highlighted in the outlook of the survey (Section 6), with the works it discusses. Entries already listed above are linked at the end of each direction.
- id: ft-generalization
  level: 3
  title: Generalization across Domains
  description: Data engines that derive supervision beyond SfM and RGB-D reconstructions, such as Internet videos, single images lifted to 3D, rendered novel views, and aerial-ground imagery.
  see_also:
  - MatchGS
  - LoMa
  - AnyMatch
  - AerialMegaDepth
  - AirZoo
  - RUBIK
  - AerialExtreMatch
- id: ft-uncertainty
  level: 3
  title: Composability and Calibrated Uncertainty
  description: Learned modules that remain valid for arbitrary inputs, and correspondences with calibrated uncertainties as a common interface between modules.
  see_also:
  - MCD
  - Match Any Keypoints
  - XRefine
  - GMM-IKRS
  - RaCo
  - PDC-Net
  - SURE
  - Cai et al.
- id: ft-efficiency
  level: 3
  title: Efficiency at the System Level
  description: Spend computation only where matches can exist, by restricting matching to overlapping or semantically matched areas, pruning tokens, and caching per-image representations.
  see_also:
  - Efficient LoFTR
  - ArgMatch
  - ZippyPoint
  - XFeat
  - LightGlue
  - Toida and Hotta
  - UltraMatch
  - DMS
- id: ft-multiview
  level: 3
  title: From Pairwise to Multi-View Matching
  description: Treat the track, not the image pair, as the unit of matching.
  see_also:
  - Detect by Track
  - MV-RoMa
  - XRefine
  - TraqPoint
- id: ft-lgm
  level: 3
  title: Large Geometric Models
  description: Feed-forward 3D models that predict pointmaps and cameras from two or more views, and their role as priors for matching and pose estimation.
  see_also:
  - MASt3R
  - RoMa-Ω
- id: ft-multimodal
  level: 3
  title: Multi-Modal Matching
  description: Matching across infrared, SAR, event, depth, and other modalities, and across dimensions (2D-3D).
  see_also:
  - MapGlue
  - UniCorrn
  - XoFTR
  - ReDFeat
  - SGPFeat
  - CrossFeat
  - CRFT
- id: surveys
  level: 2
  emoji: 📚
  title: Related Surveys and Evaluations
  description: Earlier surveys, theses, and evaluation studies on image matching and local features.
